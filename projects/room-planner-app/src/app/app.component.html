<div class="flex min-h-screen flex-col bg-gray-50 dark:bg-gray-900">
  <header
    class="sticky top-0 z-50 border-b border-gray-200 bg-white shadow-sm dark:border-gray-700 dark:bg-gray-800"
  >
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between py-4 sm:py-6">
        <h1 class="text-lg font-bold text-gray-900 sm:text-2xl dark:text-white">
          <span class="hidden sm:inline">Room Planner Demo App</span>
          <span class="sm:hidden">Room Planner</span>
        </h1>
        <div class="flex items-center gap-4">
          <!-- Desktop Navigation -->
          <nav class="hidden space-x-6 md:flex">
            <a
              routerLink="/install"
              routerLinkActive="text-blue-600 border-b-2 border-blue-600 dark:text-blue-400 dark:border-blue-400"
              class="px-3 py-2 text-sm font-medium text-gray-700 transition-colors hover:text-blue-600 dark:text-gray-300 dark:hover:text-blue-400"
            >
              Install
            </a>
            <a
              routerLink="/sample"
              routerLinkActive="text-blue-600 border-b-2 border-blue-600 dark:text-blue-400 dark:border-blue-400"
              class="px-3 py-2 text-sm font-medium text-gray-700 transition-colors hover:text-blue-600 dark:text-gray-300 dark:hover:text-blue-400"
            >
              Sample
            </a>
            <a
              routerLink="/sample-editable"
              routerLinkActive="text-blue-600 border-b-2 border-blue-600 dark:text-blue-400 dark:border-blue-400"
              class="px-3 py-2 text-sm font-medium text-gray-700 transition-colors hover:text-blue-600 dark:text-gray-300 dark:hover:text-blue-400"
            >
              Editable
            </a>
          </nav>
          <app-theme-toggle></app-theme-toggle>
          <!-- Mobile Menu Button -->
          <button
            (click)="toggleMobileMenu()"
            type="button"
            class="inline-flex items-center justify-center rounded-md p-2 text-gray-700 hover:bg-gray-100 hover:text-gray-900 focus:ring-2 focus:ring-blue-500 focus:outline-none focus:ring-inset md:hidden dark:text-gray-300 dark:hover:bg-gray-700 dark:hover:text-white"
            aria-controls="mobile-menu"
            [attr.aria-expanded]="mobileMenuOpen()"
          >
            <span class="sr-only">Open main menu</span>
            @if (!mobileMenuOpen()) {
              <svg
                class="h-6 w-6"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                aria-hidden="true"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"
                />
              </svg>
            } @else {
              <svg
                class="h-6 w-6"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                aria-hidden="true"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M6 18L18 6M6 6l12 12"
                />
              </svg>
            }
          </button>
        </div>
      </div>
    </div>
    <!-- Mobile menu -->
    @if (mobileMenuOpen()) {
      <div class="md:hidden" id="mobile-menu">
        <div
          class="space-y-1 border-t border-gray-200 px-2 pt-2 pb-3 dark:border-gray-700"
        >
          <a
            routerLink="/install"
            routerLinkActive="bg-blue-50 border-blue-500 text-blue-700 dark:bg-blue-900/20 dark:text-blue-400"
            (click)="closeMobileMenu()"
            class="block border-l-4 border-transparent py-2 pr-4 pl-3 text-base font-medium text-gray-700 hover:border-gray-300 hover:bg-gray-50 hover:text-gray-900 dark:text-gray-300 dark:hover:bg-gray-700 dark:hover:text-white"
          >
            Install
          </a>
          <a
            routerLink="/sample"
            routerLinkActive="bg-blue-50 border-blue-500 text-blue-700 dark:bg-blue-900/20 dark:text-blue-400"
            (click)="closeMobileMenu()"
            class="block border-l-4 border-transparent py-2 pr-4 pl-3 text-base font-medium text-gray-700 hover:border-gray-300 hover:bg-gray-50 hover:text-gray-900 dark:text-gray-300 dark:hover:bg-gray-700 dark:hover:text-white"
          >
            Sample
          </a>
          <a
            routerLink="/sample-editable"
            routerLinkActive="bg-blue-50 border-blue-500 text-blue-700 dark:bg-blue-900/20 dark:text-blue-400"
            (click)="closeMobileMenu()"
            class="block border-l-4 border-transparent py-2 pr-4 pl-3 text-base font-medium text-gray-700 hover:border-gray-300 hover:bg-gray-50 hover:text-gray-900 dark:text-gray-300 dark:hover:bg-gray-700 dark:hover:text-white"
          >
            Editable
          </a>
        </div>
      </div>
    }
  </header>

  <main class="flex-1">
    <router-outlet></router-outlet>
  </main>

  <footer
    class="border-t border-gray-200 bg-white dark:border-gray-700 dark:bg-gray-800"
  >
    <div class="mx-auto max-w-7xl px-4 py-4 sm:px-6 lg:px-8">
      <p class="text-center text-sm text-gray-500 dark:text-gray-400">
        Room Planner Library Demo - Built with Angular & Tailwind CSS
      </p>
    </div>
  </footer>
</div>
